name: Auto Checkin Job

on:
  schedule:
    # 每天早上6点北京时间（UTC+8）运行
    - cron: '0 22 * * *'  # UTC 22:00 = 北京时间06:00
  workflow_dispatch:

# 删掉 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 配置，新版自带Node24
jobs:
  auto-sign:
    runs-on: ubuntu-latest

    steps:
      # 升级v5 原生Node24
      - name: Checkout code
        uses: actions/checkout@v5

      # 升级v6 原生Node24
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run auto checkin script
        id: run_script
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TOKEN }}
          DEBUG: ${{ secrets.DEBUG }}
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          BARK_SERVER_URL: ${{ secrets.BARK_SERVER_URL }}
          SERVER3_SEND_KEY: ${{ secrets.SERVER3_SEND_KEY }}
        run: |
          python auto_checkin.py
